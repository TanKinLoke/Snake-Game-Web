<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orchard Snake</title>
    <meta name="description" content="A responsive, zero-dependency HTML5 Canvas Snake arcade game with crisp high-DPI inline SVG sprites, synthesized Web Audio effects, and mobile touch controls." />
    <meta property="og:title" content="Orchard Snake" />
    <meta property="og:description" content="A responsive, zero-dependency HTML5 Canvas Snake arcade game with crisp high-DPI inline SVG sprites, synthesized Web Audio effects, and mobile touch controls." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-state="title">
    <main class="game-shell" aria-label="Snake Game">
      <header class="hud-bar">
        <div class="hud-stats">
          <div class="hud-stat" aria-label="Current Score">
            <svg class="hud-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 6c-1.8-1.6-4.7-1.4-6.3.4-1.8 2-1.9 5.9-.2 9.2 1.2 2.4 3 4.4 4.8 4.4.8 0 1.3-.3 1.7-.3s.9.3 1.7.3c1.8 0 3.6-2 4.8-4.4 1.7-3.3 1.6-7.2-.2-9.2-1.6-1.8-4.5-2-6.3-.4z" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5" />
              <path d="M12 6c0-2 1.1-3.5 2.5-4" fill="none" stroke="#a16207" stroke-width="1.8" stroke-linecap="round" />
              <path d="M12.3 5.2c1.8-1.8 4.4-2 5.4-.4-1.2 1.5-3.4 1.9-5.4.4z" fill="#4ade80" stroke="#14532d" stroke-width="1" />
              <ellipse cx="8.8" cy="10.2" rx="1.2" ry="2.2" transform="rotate(-18 8.8 10.2)" fill="#fca5a5" opacity="0.7" />
            </svg>
            <div class="hud-metric">
              <span id="score-label" class="hud-label">Score</span>
              <span id="score-value" class="hud-value">0</span>
            </div>
          </div>

          <div class="hud-divider" aria-hidden="true"></div>

          <div class="hud-stat" aria-label="Best Score">
            <svg class="hud-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 4h10v5a5 5 0 0 1-10 0V4z" fill="#f59e0b" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" />
              <path d="M7 5.5H4.5a1.5 1.5 0 0 0-1.5 1.5v1a3 3 0 0 0 3 3h1.2M17 5.5h2.5A1.5 1.5 0 0 1 21 7v1a3 3 0 0 1-3 3h-1.2" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" />
              <path d="M12 14v4M8.5 20h7M10 18h4" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <div class="hud-metric">
              <span id="best-label" class="hud-label">Best · Normal</span>
              <span id="best-value" class="hud-value">0</span>
            </div>
          </div>
        </div>

        <div class="hud-actions">
          <button
            id="lang-btn"
            class="icon-btn lang-btn"
            type="button"
            aria-label="Switch to Chinese"
            title="Switch language (EN / 中文)"
          >
            中文
          </button>

          <button
            id="mute-btn"
            class="icon-btn"
            type="button"
            aria-label="Mute sound"
            aria-pressed="false"
            title="Toggle sound (M)"
          >
            <svg id="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" />
              <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <svg id="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path d="M11 5L6 9H3v6h3l5 4V5z" fill="currentColor" />
              <path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>

          <button
            id="pause-btn"
            class="icon-btn"
            type="button"
            aria-label="Pause game"
            aria-pressed="false"
            title="Pause / Resume (P)"
            disabled
          >
            <svg id="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor" />
              <rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor" />
            </svg>
            <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path d="M7 5.5v13l11-6.5-11-6.5z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </header>

      <section id="board-stage" class="board-stage" aria-label="Game Board">
        <div class="board-frame">
          <canvas
            id="game-canvas"
            data-testid="game-canvas"
            aria-label="Snake game board"
          ></canvas>

          <div
            id="game-overlay"
            class="overlay"
            role="dialog"
            aria-modal="true"
            aria-labelledby="overlay-title"
          >
            <div class="overlay-card">
              <div id="overlay-emblem" class="overlay-emblem" aria-hidden="true">
                <svg viewBox="0 0 64 64">
                  <rect x="6" y="6" width="52" height="52" rx="14" fill="#182921" stroke="rgba(134, 239, 172, 0.25)" stroke-width="2" />
                  <path d="M18 42h14a6 6 0 0 0 6-6v-8a6 6 0 0 1 6-6h4" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" />
                  <circle cx="48" cy="22" r="5" fill="#4ade80" />
                  <circle cx="49.5" cy="20.5" r="1.2" fill="#052e16" />
                  <circle cx="20" cy="24" r="5.5" fill="#ef4444" />
                  <path d="M20 18.5c0-1.5.9-2.7 2-3" fill="none" stroke="#a16207" stroke-width="1.6" stroke-linecap="round" />
                  <path d="M20.3 18c1.5-1.4 3.5-1.5 4.3-.3-1 1.2-2.7 1.5-4.3.3z" fill="#4ade80" />
                </svg>
              </div>

              <div id="new-best-badge" class="new-best-badge" hidden>New Best!</div>
              <h1 id="overlay-title" class="overlay-title">Orchard Snake</h1>
              <p id="overlay-subtitle" class="overlay-subtitle">
                Collect apples, grow longer, and avoid the walls and your own tail.
              </p>

              <div id="overlay-stats" class="overlay-stats" hidden>
                <div class="overlay-stat">
                  <span id="final-score-label" class="overlay-stat-label">Final Score</span>
                  <span id="final-score-value" class="overlay-stat-value">0</span>
                </div>
                <div class="overlay-stat">
                  <span id="final-best-label" class="overlay-stat-label">Best (Normal)</span>
                  <span id="final-best-value" class="overlay-stat-value">0</span>
                </div>
              </div>

              <div id="difficulty-picker" class="difficulty-picker" role="group" aria-label="Difficulty">
                <div class="difficulty-segmented">
                  <button
                    type="button"
                    class="difficulty-btn"
                    data-difficulty="casual"
                    aria-pressed="false"
                  >
                    Casual
                  </button>
                  <button
                    type="button"
                    class="difficulty-btn"
                    data-difficulty="normal"
                    aria-pressed="true"
                  >
                    Normal
                  </button>
                  <button
                    type="button"
                    class="difficulty-btn"
                    data-difficulty="hard"
                    aria-pressed="false"
                  >
                    Hard
                  </button>
                </div>
                <p id="difficulty-meta" class="difficulty-meta">
                  140ms start · -2ms per apple · 75ms cap
                </p>
              </div>

              <div id="visual-options" class="visual-options" role="group" aria-label="Visual and accessibility options">
                <button
                  id="contrast-toggle"
                  class="option-toggle"
                  type="button"
                  aria-pressed="false"
                >
                  High Contrast: Off
                </button>
                <button
                  id="shake-toggle"
                  class="option-toggle"
                  type="button"
                  aria-pressed="true"
                >
                  Screen Shake: On
                </button>
              </div>

              <div class="overlay-actions">
                <button
                  id="primary-cta"
                  class="btn-primary"
                  type="button"
                  data-start="true"
                  disabled
                >
                  Loading Sprites...
                </button>
                <button
                  id="secondary-cta"
                  class="btn-secondary"
                  type="button"
                  hidden
                >
                  Restart
                </button>
              </div>

              <p id="control-hints" class="control-hints">
                Arrows / WASD Move · Space / P Pause · M Mute
              </p>
            </div>
          </div>
        </div>
      </section>

      <nav class="dpad" aria-label="Directional controls">
        <button
          class="dpad-btn dpad-up"
          type="button"
          data-dir="UP"
          aria-label="Move Up"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 6l-7 8h14l-7-8z" fill="currentColor" />
          </svg>
        </button>
        <button
          class="dpad-btn dpad-left"
          type="button"
          data-dir="LEFT"
          aria-label="Move Left"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 12l8-7v14l-8-7z" fill="currentColor" />
          </svg>
        </button>
        <button
          class="dpad-btn dpad-down"
          type="button"
          data-dir="DOWN"
          aria-label="Move Down"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 18l7-8H5l7 8z" fill="currentColor" />
          </svg>
        </button>
        <button
          class="dpad-btn dpad-right"
          type="button"
          data-dir="RIGHT"
          aria-label="Move Right"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 12l-8 7V5l8 7z" fill="currentColor" />
          </svg>
        </button>
      </nav>
    </main>

    <script type="module" src="./game.js"></script>
  </body>
</html>
